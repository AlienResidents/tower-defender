<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PHOSPHOR</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        background: #05070f;
        overflow: hidden;
      }
      canvas {
        display: block;
      }
      canvas.pixi {
        position: fixed;
        inset: 0;
        z-index: 1;
      }
      #webgpu-rain {
        position: fixed;
        inset: 0;
        z-index: 2;
        pointer-events: none;
      }
      /* Pause-menu volume slider — native control with a neon grab-ball.
         The --fill var drives the cyan progress fill; set from pausemenu.ts. */
      .phosphor-slider {
        position: fixed;
        z-index: 30;
        -webkit-appearance: none;
        appearance: none;
        background: transparent;
        height: 28px; /* fat grab zone; the visible track is 8px */
        margin: 0;
        cursor: pointer;
      }
      .phosphor-slider::-webkit-slider-runnable-track {
        height: 8px;
        border-radius: 4px;
        background: linear-gradient(90deg, #00e5ff var(--fill, 90%), #16203a var(--fill, 90%));
      }
      .phosphor-slider::-webkit-slider-thumb {
        -webkit-appearance: none;
        width: 22px;
        height: 22px;
        border-radius: 50%;
        background: radial-gradient(circle at 35% 35%, #9df5ff, #00e5ff 60%, #0a6f80);
        border: 2px solid #9df5ff;
        box-shadow: 0 0 12px #00e5ff;
        margin-top: -7px; /* center the ball on the 8px track */
        cursor: grab;
      }
      .phosphor-slider::-moz-range-track {
        height: 8px;
        border-radius: 4px;
        background: linear-gradient(90deg, #00e5ff var(--fill, 90%), #16203a var(--fill, 90%));
      }
      .phosphor-slider::-moz-range-thumb {
        width: 22px;
        height: 22px;
        border-radius: 50%;
        background: radial-gradient(circle at 35% 35%, #9df5ff, #00e5ff 60%, #0a6f80);
        border: 2px solid #9df5ff;
        box-shadow: 0 0 12px #00e5ff;
        cursor: grab;
      }
    </style>
  </head>
  <body>
    <canvas id="webgpu-rain"></canvas>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
