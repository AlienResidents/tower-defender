<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PHOSPHOR /LAB</title>
    <style>
      :root {
        color-scheme: dark;
      }
      body {
        margin: 0;
        padding: 24px 32px 64px;
        background: #05070f;
        color: #9df5ff;
        font-family: 'Courier New', monospace;
        font-size: 13px;
      }
      h1 {
        color: #e8f6ff;
        letter-spacing: 8px;
        font-size: 22px;
      }
      h2 {
        color: #3ec6d8;
        letter-spacing: 4px;
        font-size: 15px;
        border-bottom: 1px solid #1b2a4a;
        padding-bottom: 6px;
        margin-top: 36px;
      }
      h3 {
        color: #e8f6ff;
        font-size: 13px;
        margin: 18px 0 6px;
        letter-spacing: 2px;
      }
      .weapon {
        border: 1px solid #1b2a4a;
        border-radius: 6px;
        padding: 12px 16px;
        margin-bottom: 14px;
        max-width: 980px;
      }
      .variants {
        display: flex;
        gap: 8px;
        margin: 6px 0 10px;
      }
      button {
        background: #0b1020;
        border: 1px solid #3ec6d8;
        color: #9df5ff;
        font-family: inherit;
        font-size: 12px;
        padding: 4px 12px;
        border-radius: 4px;
        cursor: pointer;
      }
      button:hover {
        background: #16203a;
      }
      button.active {
        background: #3ec6d8;
        color: #05070f;
        font-weight: bold;
      }
      button.default {
        border-color: #ffa63d;
        color: #ffa63d;
      }
      .sliders {
        display: grid;
        grid-template-columns: repeat(3, minmax(220px, 1fr));
        gap: 4px 24px;
        margin: 8px 0;
      }
      .slider {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .slider label {
        width: 90px;
        color: #3ec6d8;
      }
      .slider input[type='range'] {
        flex: 1;
        accent-color: #00e5ff;
      }
      .slider .val {
        width: 64px;
        text-align: right;
        color: #e8f6ff;
      }
      .actions {
        display: flex;
        gap: 8px;
        margin-top: 6px;
      }
      table {
        border-collapse: collapse;
        margin-top: 12px;
      }
      th,
      td {
        border: 1px solid #1b2a4a;
        padding: 5px 12px;
        text-align: right;
      }
      th {
        color: #3ec6d8;
      }
      td:first-child,
      th:first-child {
        text-align: left;
      }
      .hint {
        color: #3ec6d8;
        margin-top: 6px;
      }
      /* --- mech workshop --- */
      .mechlab .samples {
        display: flex;
        gap: 6px;
        flex-wrap: wrap;
        margin-bottom: 12px;
      }
      .mechrow {
        display: flex;
        gap: 18px;
        align-items: flex-start;
      }
      .mechcanvas {
        background: #0b1020;
        border: 1px solid #1b2a4a;
        border-radius: 6px;
      }
      .palette {
        min-width: 130px;
      }
      .pal-title {
        color: #5b7a94;
        font-size: 11px;
        margin-bottom: 6px;
      }
      .pal-chip {
        border: 1px dashed #3ec6d8;
        color: #9df5ff;
        padding: 6px 10px;
        margin-bottom: 6px;
        border-radius: 4px;
        cursor: grab;
        text-align: center;
        user-select: none;
      }
      .pal-chip:hover {
        background: #0e1830;
      }
      .mecheditor {
        flex: 1;
        min-width: 320px;
      }
      .partslist {
        display: flex;
        gap: 6px;
        flex-wrap: wrap;
        margin-bottom: 10px;
      }
      .part-chip {
        border: 1px solid #1b2a4a;
        color: #8a9bb8;
        padding: 4px 8px;
        border-radius: 4px;
        cursor: pointer;
        user-select: none;
      }
      .part-chip.active {
        border-color: #00e5ff;
        color: #9df5ff;
      }
      .part-chip .del {
        color: #ff4455;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <h1>PHOSPHOR /LAB</h1>
    <div class="hint">
      weapon sfx tuning + dice-economy simulation · <a href="/">back to game</a>
    </div>
    <h2>MECH WORKSHOP</h2>
    <div id="mechlab"></div>
    <h2>WEAPON SFX</h2>
    <div id="sfx"></div>
    <h2>DICE ECONOMY SIM</h2>
    <div id="sim"></div>
    <script type="module" src="/src/lab/main.ts"></script>
  </body>
</html>
